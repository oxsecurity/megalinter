---
# =============================================================
# zizmor configuration
# https://docs.zizmor.sh/configuration/
#
# Generated by `npx mega-linter-runner --custom-flavor-setup`.
# =============================================================
rules:
  unpinned-uses:
    config:
      # The generated workflows hash-pin every third-party action, with one
      # deliberate exception: the MegaLinter custom flavor builder tracks
      # @main, so your flavor is always built by the builder matching the
      # upstream MegaLinter release. Hash-pinning it would strand this
      # repository on an outdated builder.
      policies:
        oxsecurity/megalinter/flavors/custom-builder: ref-pin
        "*": hash-pin
