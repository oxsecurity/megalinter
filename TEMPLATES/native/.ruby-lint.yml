---
# Native mode (MegaLinter without Docker): same as .ruby-lint.yml, without the line endings
# check: on Windows, rubocop expects CRLF by default and writes its fixes with CRLF, so LF
# files and fixed files would be reported. Git normalizes line endings (.gitattributes)
inherit_gem:
  rubocop-github:
    - config/default.yml

Layout/EndOfLine:
  Enabled: false
