- id: megalinter-native-incremental
  name: Run MegaLinter without Docker (skipping linters that run in project mode)
  # pre-commit installs mega-linter-runner once (npx would re-check it on each commit, several
  # seconds). Its version is written by the release build: the hooks of a tag run that version
  entry: mega-linter-runner
  language: node
  additional_dependencies:
    - mega-linter-runner@beta
  require_serial: true
  args:
    - --native
    - --release
    - beta
    - --fix
    - --env
    - "CLEAR_REPORT_FOLDER=true"
    - --env
    - "LOG_LEVEL=warning"
    - --filesonly
  description: >
    Native mode (beta): the linters run directly on your machine, without Docker,
    so the hook is much faster. Only the linters listed in NATIVE_LINTERS of
    .mega-linter.yml run. Install them once, with the version of the hook:
    `npx mega-linter-runner@beta --install-linters --release beta` (it also offers
    to install the language runtimes they need), as a hook can not ask questions.
    See https://megalinter.io/latest/install-native/. Depends on Node.js and uv,
    plus Git Bash on Windows. Linter results are logged to the
    megalinter-reports directory, so list it in your .gitignore. Skip linters
    that run in project mode since they don't run incrementally.

