---
descriptor_id: JSX
descriptor_type: language
descriptor_flavors:
  - cupcake
  - dotnetweb
  - javascript
file_extensions:
  - ".jsx"
linters:
  # ESLINT
  - extends: eslint
    linter_name: eslint
    linter_text: |
      **ESLint with React Plugin** provides comprehensive linting for JSX files, combining ESLint's powerful static analysis with React-specific rules to ensure high-quality React applications written in JavaScript.

      **Key Features:**

      - **React-Specific Linting**: Comprehensive rules covering React best practices, hooks usage, JSX syntax, and component lifecycle patterns
      - **JSX Syntax Validation**: Comprehensive validation of JSX syntax, prop types, and component structure with intelligent error reporting
      - **Hooks Rules**: Thorough validation of React Hooks usage patterns, dependencies arrays, and effect cleanup to prevent common bugs
      - **Performance Optimization**: Rules to detect unnecessary re-renders, missing keys in lists, and performance anti-patterns
      - **Modern React Patterns**: Support for latest React features including fragments, context, refs, and concurrent features

      ESLint requires a custom configuration file applicable to your project. You can create it by typing `npx eslint --init` in the root of your repository

      ### ESLint v10 — resolving bare imports from `eslint.config.mjs`

      ESLint v10 dropped support for the legacy `.eslintrc.*` format and only loads the new flat config (`eslint.config.*`). When MegaLinter runs ESLint from its own container install (`/node-deps/node_modules`) instead of your project's local `node_modules`, Node's ESM resolver may fail to locate bare imports such as `import js from '@eslint/js'` (upstream limitation tracked in [eslint/eslint#18465](https://github.com/eslint/eslint/issues/18465)), producing errors like:

      ```text
      Error [ERR_MODULE_NOT_FOUND]: Cannot find package '@eslint/js' imported from /github/workspace/eslint.config.mjs
      ```

      Two recommended workarounds:

      #### Workaround 1 — Use `createRequire` in `eslint.config.mjs`

      Bare imports fall back to CommonJS resolution (which honors `NODE_PATH` and will pick up MegaLinter's bundled `@eslint/js` and related plugins):

      ```js
      import { createRequire } from 'module';
      const require = createRequire(import.meta.url);
      const js = require('@eslint/js');
      const reactPlugin = require('@eslint-react/eslint-plugin');
      ```

      #### Workaround 2 — Install dependencies in a pre-command and use the project-local ESLint binary

      ESLint then runs from `<workspace>/node_modules` and resolves your config's imports naturally:

      ```yaml
      JSX_ESLINT_PRE_COMMANDS:
        - command: yarn install --frozen-lockfile --ignore-scripts
          cwd: workspace
          continue_if_failed: false
      JSX_ESLINT_CLI_EXECUTABLE: node_modules/.bin/eslint
      ```

      Replace `yarn install --frozen-lockfile --ignore-scripts` with `npm ci` (or `npm install --include=dev`) if your project uses npm.

      For **pnpm** — which is not pre-installed in the MegaLinter image but ships with Node via [Corepack](https://nodejs.org/api/corepack.html) — enable it first, then install:

      ```yaml
      JSX_ESLINT_PRE_COMMANDS:
        - command: corepack enable pnpm
          cwd: workspace
          continue_if_failed: false
        - command: pnpm install --frozen-lockfile --ignore-scripts
          cwd: workspace
          continue_if_failed: false
      JSX_ESLINT_CLI_EXECUTABLE: node_modules/.bin/eslint
      ```

      To add a single package with pnpm instead of installing the full tree, run `corepack enable pnpm` first, then `pnpm add --ignore-workspace --no-save <package>`.
    linter_url: https://github.com/Rel1cx/eslint-react
    linter_repo: https://github.com/Rel1cx/eslint-react
    linter_rules_url: https://eslint-react.xyz/docs/rules/overview
    linter_banner_image_url: https://d33wubrfki0l68.cloudfront.net/3b5ac7586466159bb6f237b633bfc4f5a8d5acf8/ee0a1/assets/img/posts/eslint-collective.png
    linter_rules_configuration_url: https://eslint-react.xyz/docs/getting-started/installation
    linter_rules_ignore_config_url: https://eslint.org/docs/latest/user-guide/configuring/ignoring-code#the-eslintignore-file
    config_file_name: eslint.config.cjs
    common_linter_errors:
      - identifier: JSX_ESLINT_ERROR_PLUGIN_NOT_FOUND
        regex: '(Failed to load plugin ''|ESLint couldn''t find the plugin "|Cannot find module ''eslint-plugin-)'
        message: |-
          ESLint could not load a plugin referenced in your config (e.g. `eslint-plugin-react`, `eslint-plugin-react-hooks`, `@eslint-react/eslint-plugin`). The plugin is not installed in MegaLinter's bundled `node_modules` (`/node-deps/node_modules`).
          Resolutions:
            - Pre-install the missing plugin via a pre-command in your .mega-linter.yml:
                JSX_ESLINT_PRE_COMMANDS:
                  - command: "npm install eslint-plugin-react eslint-plugin-react-hooks"
                    cwd: "root"
                    continue_if_failed: false
            - Or install your project's dependencies and run the project-local ESLint binary:
                JSX_ESLINT_PRE_COMMANDS:
                  - command: yarn install --frozen-lockfile --ignore-scripts
                    cwd: workspace
                    continue_if_failed: false
                JSX_ESLINT_CLI_EXECUTABLE: node_modules/.bin/eslint
      - identifier: JSX_ESLINT_ERROR_CONFIG_NOT_FOUND
        regex: '(ESLint couldn''t find the config "|Failed to load config "|Cannot find module ''eslint-config-)'
        message: |-
          ESLint could not resolve a shareable config referenced via `extends` (e.g. `airbnb`, `react-app`).
          Resolutions:
            - Pre-install the config package via a pre-command in your .mega-linter.yml:
                JSX_ESLINT_PRE_COMMANDS:
                  - command: "npm install eslint-config-NAME"
                    cwd: "root"
                    continue_if_failed: false
            - Or install your project's dependencies and use the workspace ESLint binary (see ESLint v10 section above).
      - identifier: JSX_ESLINT_ERROR_FLAT_CONFIG_MODULE_NOT_FOUND
        regex: "ERR_MODULE_NOT_FOUND.+eslint\\.config\\."
        message: |-
          ESLint v9+/v10 flat config (`eslint.config.mjs`) uses native ESM resolution, which does not honor `NODE_PATH`. Bare imports like `import reactPlugin from '@eslint-react/eslint-plugin'` fail when ESLint runs from MegaLinter's bundled install.
          Resolutions:
            - Use `createRequire` in your `eslint.config.mjs` (see the "ESLint v10" section in this linter's documentation above).
            - Or install your project's dependencies and run the project-local ESLint binary:
                JSX_ESLINT_PRE_COMMANDS:
                  - command: yarn install --frozen-lockfile --ignore-scripts
                    cwd: workspace
                    continue_if_failed: false
                JSX_ESLINT_CLI_EXECUTABLE: node_modules/.bin/eslint
    examples:
      - "eslint myfile.jsx"
      - "eslint -c eslint.config.js --no-ignore myfile.jsx"
      - "eslint --fix -c eslint.config.js --no-ignore myfile.jsx"
    install:
      dockerfile:
        - |-
          # renovate: datasource=npm depName=eslint
          ARG NPM_ESLINT_VERSION=10.9.1
        - |-
          # renovate: datasource=npm depName=@eslint-react/eslint-plugin
          ARG NPM_ESLINT_REACT_ESLINT_PLUGIN_VERSION=5.18.7
        - |-
          # renovate: datasource=npm depName=@microsoft/eslint-formatter-sarif
          ARG NPM_MICROSOFT_ESLINT_FORMATTER_SARIF_VERSION=3.1.0
      npm:
        - eslint@${NPM_ESLINT_VERSION}
        - "@eslint-react/eslint-plugin@${NPM_ESLINT_REACT_ESLINT_PLUGIN_VERSION}"
        - "@microsoft/eslint-formatter-sarif@${NPM_MICROSOFT_ESLINT_FORMATTER_SARIF_VERSION}"
  # BIOME
  - extends: biome
    linter_name: biome
    test_folder: jsx_biome
    examples:
      - "biome check myfile.jsx"
      - "biome check --config-path biome.json myfile.jsx"
      - "biome check --write myfile.jsx"
