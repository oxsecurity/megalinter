---
descriptor_id: LUA
descriptor_type: language
file_extensions:
  - ".lua"
install:
  apk:
    - lua5.3
linters:
  # LUACHECK
  - class: LuacheckLinter
    linter_name: luacheck
    linter_text: |
      **luacheck** is a static analyzer and linter for Lua code that detects various issues such as usage of undefined global variables, unused variables and values, accessing uninitialized variables, and unreachable code. It provides comprehensive code quality analysis for Lua projects.

      **Key Features:**

      - **Multi-version Lua support** for Lua 5.1-5.4 and LuaJIT syntax checking
      - **Undefined global variable detection** to catch common runtime errors
      - **Unused variable and value analysis** to improve code cleanliness
      - **Uninitialized variable access detection** for safer code
      - **Unreachable code identification** to optimize program flow
      - **Custom project globals** configuration for specific environments
      - **Standard library version selection** matching your Lua version
      - **Warning filtering** by type and variable name patterns
      - **Inline configuration comments** for granular control
      - **Project-wide config files** using `.luacheckrc`
      - **Detailed error reporting** with line numbers and suggestions
    linter_url: https://luacheck.readthedocs.io
    linter_repo: https://github.com/lunarmodules/luacheck
    linter_spdx_license: MIT
    linter_rules_url: https://luacheck.readthedocs.io/en/stable/warnings.html
    linter_rules_configuration_url: https://luacheck.readthedocs.io/en/stable/config.html
    linter_rules_inline_disable_url: https://luacheck.readthedocs.io/en/stable/inline.html
    linter_megalinter_ref_url: "no"
    config_file_name: .luacheckrc
    cli_config_arg_name: "--config"
    cli_lint_mode: list_of_files
    supported_cli_lint_modes:
      - file
      - list_of_files
      - project
    cli_lint_mode_project_extra_args_after:
      - .
    common_linter_errors:
      - identifier: LUA_LUACHECK_ERROR_CONFIG_INVALID
        regex: "(Couldn't load configuration|Critical error: .*\\.luacheckrc|Errors? in config file)"
        message: |-
          luacheck could not load its configuration file (`.luacheckrc` is Lua source).
          Resolutions:
            - Run `lua -l .luacheckrc -e ''` locally (or `luac -p .luacheckrc`) to check the file for syntax errors.
            - Ensure the file only sets allowed luacheck options (`std`, `globals`, `ignore`, `files`, etc.).
            - Use `luacheck --no-config` via `LUA_LUACHECK_ARGUMENTS` to confirm the failure is config-related.
    examples:
      - "luacheck myfile.lua"
      - "luacheck --config .chktexrc myfile.lua"
    install:
      apk:
        - openssl
      dockerfile:
        - |
          # renovate: datasource=github-tags depName=cvega/luarocks
          ARG LUA_LUACHECK_VERSION=3.3.1
        - |
          # luarocks compiles native rocks during installation: the toolchain is
          # only needed within this RUN and evicted from the final layers
          RUN apk add --no-cache --virtual .lua-build-deps gcc make musl-dev lua5.3-dev readline-dev \
              && wget --tries=5 https://github.com/cvega/luarocks/archive/v${LUA_LUACHECK_VERSION}-super-linter.tar.gz -O - -q | tar -xzf - \
              && cd luarocks-${LUA_LUACHECK_VERSION}-super-linter \
              && ./configure --with-lua-include=/usr/include/lua5.3 \
              && make \
              && make -b install \
              && cd .. && rm -r luarocks-${LUA_LUACHECK_VERSION}-super-linter/ \
              && luarocks install luacheck \
              && cd / \
              && apk del .lua-build-deps \
              && rm -rf /root/.cache/luarocks
    native_install:
      method: binary
      # renovate: datasource=github-releases depName=lunarmodules/luacheck extractVersion=^v(?<version>.+)$
      version: "1.2.0"
      libc: glibc
      assets:
        linux/amd64:
          url: https://github.com/lunarmodules/luacheck/releases/download/v{{VERSION}}/luacheck
          archive: none
          name: luacheck
        windows/amd64:
          url: https://github.com/lunarmodules/luacheck/releases/download/v{{VERSION}}/luacheck.exe
          archive: none
          name: luacheck.exe
      provenance:
        gpg:
          keyring: luacheck.asc
          signature_url: https://github.com/lunarmodules/luacheck/releases/download/v{{VERSION}}/{{ASSET_NAME}}.asc
      platforms:
        - linux/amd64
        - windows/amd64
      unsupported:
        linux/arm64: "luacheck publishes a Linux binary for x86_64 only. Use Docker."
        darwin/amd64: "luacheck publishes no macOS binary (it is a LuaRocks package that needs a Lua toolchain). Use Docker."
        darwin/arm64: "luacheck publishes no macOS binary (it is a LuaRocks package that needs a Lua toolchain). Use Docker."
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      brackets:
        - name: brackets-luacheck
          url: https://github.com/Malcolm3141/brackets-luacheck
      emacs:
        - name: flycheck
          url: http://www.flycheck.org/en/latest/languages.html#lua
      sublime:
        - name: SublimeLinter-luacheck
          url: https://packagecontrol.io/packages/SublimeLinter-luacheck
      vim:
        - name: Syntastic
          url: https://github.com/vim-syntastic/syntastic/wiki/Lua%3A---luacheck
      vscode:
        - name: vscode-luacheck
          url: https://marketplace.visualstudio.com/items?itemName=dwenegar.vscode-luacheck
  # STYLUA
  - class: StyLuaLinter
    linter_name: stylua
    linter_text: |
      **StyLua** is an opinionated code formatter for Lua that automatically formats Lua code to enforce consistent style. It removes the need for debates about formatting by providing sensible defaults while still allowing some configuration.

      **Key Features:**

      - **Opinionated formatting** with sensible defaults for consistent Lua code style
      - **Automatic indentation** and spacing management
      - **Line break optimization** for improved code readability
      - **Configurable options** via `stylua.toml` for project-specific needs
      - **Lua 5.1-5.4 support** covering all modern Lua versions
      - **LuaJIT compatibility** for Just-In-Time compiled Lua code
      - **Roblox Luau support** with specialized formatting rules
      - **Fast performance** for formatting large codebases quickly
      - **Ignore comments** to exclude specific code sections from formatting
      - **Range formatting** to format only selected portions of files
    linter_url: https://github.com/JohnnyMorganz/StyLua
    linter_repo: https://github.com/JohnnyMorganz/StyLua
    linter_rules_url: https://roblox.github.io/lua-style-guide/
    linter_rules_configuration_url: https://github.com/JohnnyMorganz/StyLua?tab=readme-ov-file#configuration
    linter_rules_inline_disable_url: https://github.com/JohnnyMorganz/StyLua?tab=readme-ov-file#ignoring-parts-of-a-file
    linter_megalinter_ref_url: "no"
    config_file_name: stylua.toml
    cli_config_arg_name: "--config-path"
    cli_version_arg_name: "-V"
    supported_cli_lint_modes:
      - file
      - list_of_files
      - project
    cli_lint_extra_args:
      - "--check"
    cli_lint_mode_project_extra_args_after:
      - .
    examples:
      - "stylua --check myfile.lua"
      - "stylua --config-path chktexrc.toml --check myfile.lua"
    install:
      dockerfile:
        - |-
          # renovate: datasource=github-releases depName=JohnnyMorganz/StyLua extractVersion=^v(?<version>.+)$
          ARG CARGO_STYLUA_VERSION=2.6.0
        - |-
          FROM alpine:3.24 AS cargo-bin-stylua
          ARG TARGETARCH
          ARG CARGO_STYLUA_VERSION
          RUN set -eu; mkdir -p /out/bin; \
              apk add --no-cache curl ca-certificates unzip; \
              case "$TARGETARCH" in \
                amd64) ARCH=x86_64 ;; \
                arm64) ARCH=aarch64 ;; \
                *) echo "unsupported arch: $TARGETARCH" >&2; exit 1 ;; \
              esac; \
              curl -fsSL -o /tmp/stylua.zip \
                "https://github.com/JohnnyMorganz/StyLua/releases/download/v${CARGO_STYLUA_VERSION}/stylua-linux-${ARCH}-musl.zip" && \
              unzip /tmp/stylua.zip -d /out/bin && \
              rm /tmp/stylua.zip && \
              chmod +x /out/bin/stylua
        - COPY --link --from=cargo-bin-stylua /out/bin/stylua /usr/bin/stylua
    native_install:
      method: binary
      version: "${CARGO_STYLUA_VERSION}"
      assets:
        linux/amd64:
          url: https://github.com/JohnnyMorganz/StyLua/releases/download/v{{VERSION}}/stylua-linux-x86_64-musl.zip
          archive: zip
        linux/arm64:
          url: https://github.com/JohnnyMorganz/StyLua/releases/download/v{{VERSION}}/stylua-linux-aarch64-musl.zip
          archive: zip
        darwin/amd64:
          url: https://github.com/JohnnyMorganz/StyLua/releases/download/v{{VERSION}}/stylua-macos-x86_64.zip
          archive: zip
        darwin/arm64:
          url: https://github.com/JohnnyMorganz/StyLua/releases/download/v{{VERSION}}/stylua-macos-aarch64.zip
          archive: zip
        windows/amd64:
          url: https://github.com/JohnnyMorganz/StyLua/releases/download/v{{VERSION}}/stylua-windows-x86_64.zip
          archive: zip
      provenance:
        github_attestation: JohnnyMorganz/StyLua
      platforms:
        - linux/amd64
        - linux/arm64
        - darwin/amd64
        - darwin/arm64
        - windows/amd64
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      neovim:
        - name:
            - nvim-lint
            - none-ls
            - stylua-nvim
            - stylua.nvim
          url:
            - https://github.com/mfussenegger/nvim-lint
            - https://github.com/nvimtools/none-ls.nvim
            - https://github.com/ckipp01/stylua-nvim
            - https://github.com/wesleimp/stylua.nvim
      vscode:
        - name: Stylua
          url: https://marketplace.visualstudio.com/items?itemName=JohnnyMorganz.stylua
      sublime:
        - name: Sublime-Pretty-Lua
          url: https://packagecontrol.io/packages/Pretty%20Lua
