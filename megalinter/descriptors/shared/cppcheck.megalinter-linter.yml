---
linter_name: cppcheck
linter_url: https://cppcheck.sourceforge.io/
linter_repo: https://cppcheck.sourceforge.io/
linter_megalinter_ref_url: https://github.com/cppcheck-opensource/cppcheck-htdocs/pull/32
linter_spdx_license: GPL-3.0
linter_rules_url: https://sourceforge.net/p/cppcheck/wiki/ListOfChecks/
linter_rules_configuration_url: https://cppcheck.sourceforge.io/manual.html#configuration
cli_lint_errors_count: regex_count
cli_lint_errors_regex: "error:"
cli_lint_mode: list_of_files
supported_cli_lint_modes:
  - file
  - list_of_files
  - project
cli_lint_extra_args:
  - --error-exitcode=1
cli_lint_mode_project_exclude_arg_name: -i
cli_lint_mode_project_exclude_arg_value: "**/{{DIR}}/**"
cli_lint_mode_project_extra_args_after:
  - .
can_output_sarif: true
cli_sarif_args:
  - "--output-format=sarif"
examples:
  - cppcheck myfile.cpp
install:
  apk:
    - cppcheck
native_install:
  # No portable build with verifiable provenance for all platforms: cppcheck is provided by the host
  method: runtime_provided
  # Host cppcheck versions do not all support globs in -i: forward the excluded folders as paths
  linter_overrides:
    cli_lint_mode_project_exclude_arg_value: "{{DIR_PATH}}"
  suggest:
    windows: "winget install --id Cppcheck.Cppcheck -e"
    darwin: "brew install cppcheck"
    linux: "Install cppcheck from your distribution (example: sudo apt install cppcheck)"
  platforms:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
    - windows/amd64
supported_platforms:
  platform:
    - linux/amd64
    - linux/arm64
