---
descriptor_id: GRAPHQL
descriptor_type: format
descriptor_flavors:
  - all_flavors # Can be found in any language project
  - cupcake
file_extensions:
  - ".graphql"
linters:
  # BIOME
  - extends: biome
    linter_name: biome
    test_folder: graphql_biome
    examples:
      - "biome check myfile.graphql"
      - "biome check --config-path biome.json myfile.graphql"
      - "biome check --write myfile.graphql"
