---
descriptor_id: CLOJURE
descriptor_type: language
descriptor_flavors:
  - cupcake
  - java
file_extensions:
  - ".clj"
  - ".cljs"
  - ".cljc"
  - ".edn"
install:
  apk:
    - curl
linters:
  # clj-kondo
  - class: CljKondoLinter
    linter_name: clj-kondo
    linter_text: |
      **clj-kondo** is a static analyzer and linter for Clojure code that sparks joy. It performs static analysis on Clojure, ClojureScript and EDN files to detect potential errors without executing your program.

      **Key Features:**

      - **Comprehensive Error Detection**: Detects arity errors, unused private vars, unresolved symbols, redefined vars, missing map keys, conditions that are always true or false, and many other issues
      - **Style Guide Recommendations**: Enforces best practices from Stuart Sierra's "how to ns" and the Clojure Style Guide
      - **Type Checking**: Infers argument and return types, including destructured map keys and values, and reports type mismatches at call sites
      - **Modern Clojure Support**: Understands the latest Clojure and ClojureScript syntax, such as Clojure 1.13 required keys (`:keys!`) in map destructuring
      - **Macro Support**: Built-in support for core macros and popular community libraries, with extensible configuration and hooks for custom macros
      - **Fast Performance**: Compiled to native code using GraalVM for fast startup and execution

      **MegaLinter integration notes:**

      - All the files are linted in a single clj-kondo run (`list_of_files` lint mode), so cross-namespace checks such as arity errors on vars defined in other files are reported without a cache
      - clj-kondo runs with `--cache false`, so it neither reads nor writes the `.clj-kondo/.cache` folder while MegaLinter analyzes your repository. To use a cache you built beforehand (for example with `--dependencies`), set `CLOJURE_CLJ_KONDO_COMMAND_REMOVE_ARGUMENTS: ["--cache", "false"]`
      - In `project` lint mode, `EXCLUDED_DIRECTORIES` are forwarded as an `:output {:exclude-files [...]}` inline configuration, merged with your own: files located in excluded directories are still analyzed, but their findings are not reported
    linter_url: https://github.com/clj-kondo/clj-kondo
    linter_repo: https://github.com/clj-kondo/clj-kondo
    linter_spdx_license: EPL-1.0
    linter_rules_url: https://github.com/clj-kondo/clj-kondo/blob/master/doc/linters.md
    linter_banner_image_url: https://github.com/clj-kondo/clj-kondo/raw/master/logo/logo-300dpi.png
    linter_rules_configuration_url: https://github.com/clj-kondo/clj-kondo/blob/master/doc/config.md#configuration
    linter_rules_ignore_config_url: https://github.com/clj-kondo/clj-kondo/blob/master/doc/config.md#exclude-files-from-being-linted
    linter_rules_inline_disable_url: https://github.com/clj-kondo/clj-kondo/blob/master/doc/config.md#ignore-warnings-in-an-expression
    linter_megalinter_ref_url: https://github.com/clj-kondo/clj-kondo/blob/master/doc/ci-integration.md#github
    config_file_name: .clj-kondo/config.edn
    cli_lint_mode: list_of_files
    supported_cli_lint_modes:
      - file
      - list_of_files
      - project
    cli_config_arg_name: "--config"
    # Do not read or write the cache in .clj-kondo/.cache of the analyzed sources
    cli_lint_extra_args:
      - "--cache"
      - "false"
    # --lint must be the last option in every lint mode: clj-kondo assigns all
    # the following arguments to it
    cli_lint_mode_file_extra_args_after:
      - "--lint"
    cli_lint_mode_list_of_files_extra_args_after:
      - "--lint"
    # In project mode, the excluded directories --config is appended before
    # these arguments
    cli_lint_mode_project_extra_args_after:
      - "--lint"
      - .
    cli_lint_errors_count: regex_number
    cli_lint_errors_regex: "linting took [0-9]+ms, errors: ([0-9]+)"
    cli_lint_warnings_count: regex_number
    cli_lint_warnings_regex: "linting took [0-9]+ms, errors: [0-9]+, warnings: ([0-9]+)"
    can_output_sarif: true
    cli_sarif_args:
      - "--config"
      - "{:output {:format :sarif}}"
    common_linter_errors:
      - identifier: CLOJURE_CLJ_KONDO_ERROR_CONFIG_INVALID
        regex: "(error while reading .*\\.clj-kondo|No reader function for tag|Invalid (token|leading character|EDN)|Unmatched delimiter)"
        message: |-
          clj-kondo could not read its configuration file (`.clj-kondo/config.edn`).
          Resolutions:
            - Validate the EDN syntax (balanced `{}`, `[]`, `()`, no trailing commas; keys are usually keywords like `:linters`).
            - Run `clj-kondo --config '{}' --lint <file>` to confirm the failure is config-related.
            - Compare against the reference config at <https://github.com/clj-kondo/clj-kondo/blob/master/doc/config.md>.
    examples:
      - "clj-kondo --lint myfile.clj"
      - "clj-kondo --lint myfile.clj myotherfile.cljs"
      - "clj-kondo --config .clj-kondo/config.edn --lint myfile.clj"
    install:
      dockerfile:
        - |
          # renovate: datasource=github-tags depName=clj-kondo/clj-kondo
          ARG CLJ_KONDO_VERSION=2026.08.04
        - |
          RUN curl --retry 5 --retry-delay 5 -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/refs/tags/v${CLJ_KONDO_VERSION}/script/install-clj-kondo \
              && chmod +x install-clj-kondo \
              && ./install-clj-kondo --version "$CLJ_KONDO_VERSION"
    supported_platforms:
      platform:
        - linux/amd64
        # install-clj-kondo auto-picks clj-kondo-*-linux-static-amd64.zip on amd64.
        # arm64 release is glibc-linked (clj-kondo-*-linux-aarch64.zip): GraalVM
        # builds static musl binaries only on x86_64, so Alpine arm64 isn't supported.
        #- linux/arm64
    ide:
      emacs:
        - name: flycheck-clj-kondo
          url: https://github.com/borkdude/flycheck-clj-kondo
        - name: flymake-kondor
          url: https://github.com/turbo-cafe/flymake-kondor
      idea:
        - name: Clojure Extras
          url: https://plugins.jetbrains.com/plugin/18108-clojure-extras
      sublime:
        - name: SublimeLinter-contrib-clj-kondo
          url: https://github.com/ToxicFrog/SublimeLinter-contrib-clj-kondo
      vim:
        - name: ALE
          url: https://github.com/dense-analysis/ale
      vscode:
        - name: Calva
          url: https://marketplace.visualstudio.com/items?itemName=betterthantomorrow.calva
        - name: clojure-lsp
          url: https://clojure-lsp.io/

    # cljstyle
  - linter_name: cljstyle
    linter_text: |
      **cljstyle** is a comprehensive tool for formatting Clojure code that transforms messy, inconsistent code into beautifully formatted, readable source files. It's a rewrite of the original cljfmt tool with enhanced capabilities and native compilation.

      **Key Features:**

      - **Automatic Code Formatting**: Transforms poorly formatted Clojure code into clean, consistent, and readable format
      - **Comprehensive Rules**: Handles indentation, spacing, line breaks, namespace formatting, and function definitions
      - **Highly Configurable**: Extensive configuration options through `.cljstyle` files with format rules and width constraints
      - **Multi-Command Interface**: Supports check, fix, pipe, find, and config commands for different workflows
      - **Form Ignoring**: Flexible ignore patterns with comment forms, discard macros, and metadata tags
      - **Native Performance**: Compiled to native binary for fast startup and execution
    linter_url: https://github.com/greglook/cljstyle
    linter_repo: https://github.com/greglook/cljstyle
    linter_spdx_license: EPL-1.0
    linter_rules_url: https://github.com/greglook/cljstyle/blob/main/doc/configuration.md#format-rules
    # linter_banner_image_url: https://github.com/borkdude/clj-kondo/raw/master/logo/logo-300dpi.png
    linter_rules_configuration_url: https://github.com/greglook/cljstyle/blob/main/doc/configuration.md#format-rules
    linter_rules_inline_disable_url: https://github.com/greglook/cljstyle#ignoring-forms
    linter_megalinter_ref_url: https://github.com/greglook/cljstyle/pull/118
    config_file_name: .cljstyle
    cli_config_arg_name: ""
    cli_lint_mode: list_of_files
    supported_cli_lint_modes:
      - file
      - list_of_files
      - project
    cli_lint_extra_args:
      - "check"
    # Repeatable, values are compiled as regexes matched against the full path,
    # and they are added to the ignore set of the user .cljstyle config
    cli_lint_mode_project_exclude_arg_name: "--ignore"
    cli_lint_mode_project_extra_args_after:
      - .
    cli_lint_fix_arg_name: "fix"
    cli_lint_fix_remove_args:
      - "check"
    cli_version_arg_name: version
    test_folder: clojure-style
    examples:
      - "cljstyle check"
      - "cljstyle fix"
      - "cljstyle fix myfile.clj path/to/myfile.clj"
    install:
      dockerfile:
        - |-
          # renovate: datasource=github-tags depName=greglook/cljstyle
          ARG CLJ_STYLE_VERSION=0.17.642
        - |
          RUN curl --retry 5 --retry-delay 5 -sLO https://raw.githubusercontent.com/greglook/cljstyle/main/util/install-cljstyle \
              && chmod +x install-cljstyle \
              && ./install-cljstyle --static --version "$CLJ_STYLE_VERSION"
    supported_platforms:
      platform:
        - linux/amd64
        # https://github.com/sgerrand/alpine-pkg-glibc does not appear to be compatible with ARM or uses older versions of glibc.
        # https://github.com/greglook/cljstyle/issues/115
        #- linux/arm64
    ide:
      emacs:
        - name: cljstyle-mode
          url: https://github.com/greglook/cljstyle/blob/main/doc/integrations.md#emacs
