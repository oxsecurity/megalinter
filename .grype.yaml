# MegaLinter repo-local grype configuration
# Extends the defaults in TEMPLATES/.grype.yaml with exclusions specific to this repository.
# .grype.yaml config reference: https://oss.anchore.com/docs/reference/grype/configuration/

# upon scanning, if a severity is found at or above the given severity then the return code will be 1
fail-on-severity: "high"

# Exclude intentionally-vulnerable test fixtures used by trivy/grype/osv-scanner/syft linter tests.
# These directories contain deliberately old/vulnerable packages to exercise the security scanners;
# they are not real MegaLinter dependencies.
exclude:
  - "./.automation/test/**"

# Vulnerabilities that grype flags but that are not exploitable in MegaLinter's context.
# Mirrors the reasoning documented in .trivyignore and mega-linter-runner/.trivyignore.
ignore:
  # brace-expansion 2.1.2 in mega-linter-runner/yarn.lock: unbounded-memory DoS in expand(),
  # availability only (CVSS A:H), reached solely through minimatch glob expansion over
  # patterns from the user's own .mega-linter.yml and local paths, never attacker-controlled
  # input. The fix exists only in 5.0.8 and both current minimatch releases (9.0.9, 10.2.5)
  # still declare `brace-expansion ^2.0.2`, so there is no upgrade path today.
  # Remove once minimatch depends on brace-expansion >= 5.0.8.
  - vulnerability: GHSA-mh99-v99m-4gvg
  - vulnerability: CVE-2026-14257
  # braces 3.0.3 in mega-linter-runner/yarn.lock: stack-exhaustion DoS through deeply nested
  # brace patterns, reached solely through micromatch (fast-glob, globby) over glob patterns
  # from our own code and the user's local paths, never attacker-controlled input.
  # 3.0.3 is the latest release and the advisory has no fixed version.
  # Remove once a patched braces release ships.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
  - vulnerability: CVE-2026-93687
  # http-cache-semantics 4.2.0 in mega-linter-runner/yarn.lock: cross-user response disclosure
  # from a SHARED cache through max-stale, reached solely through make-fetch-happen whose
  # cache is the private local npm cache of the user running the one-shot CLI.
  # 4.2.0 is the latest release and the advisory has no fixed version.
  # Remove once a patched http-cache-semantics release ships.
  - vulnerability: GHSA-ch52-4w7c-c8xp
  - vulnerability: CVE-2026-93748
