---
# Toolchain of .automation/native_lock.py, shared by the "Native locks" and "Auto-Update Linters"
# workflows so that locks generated on feature branches and on main come from the same setup
name: "Native lock toolchain"
description: "Install the tools used to generate and verify the native install locks"
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: .python-version
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.x"
    - name: Setup Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: "3.4"
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install MegaLinter
      shell: bash
      run: python -m pip install -e . jsonschema
    - name: Check native_install declarations
      shell: bash
      run: python -m megalinter.native.spec
