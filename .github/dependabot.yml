---
#################################
# GitHub Dependabot Config info #
#################################
# Supply-chain hardening: every version-update block waits until a release is
# at least 7 days old (cooldown) before opening a PR, so compromised releases
# can be caught by the community first. Dependabot SECURITY updates are not
# subject to cooldown and still open immediately. Renovate applies the same
# rule (minimumReleaseAge: 7 days, none for vulnerability alerts): keep both in sync.
version: 2
updates:
  # Dependabot alone owns GitHub Actions: Renovate's github-actions manager is
  # disabled (see renovate.json5), so keep every SHA-pinned action here
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/flavors/custom-builder"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Maintain dependencies for js with npm
  - package-ecosystem: "npm"
    directory: "/mega-linter-runner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Test fixtures under .automation/test: Dependabot opens NO version update PR
  # there (`ignore: "*"` below), to avoid duplicates with Renovate, which keeps
  # the good/, fix/... fixtures up to date in one weekly grouped PR and skips the
  # frozen ones (see renovate.json5 ignorePaths).
  # The frozen fixtures, bad/ folders and .wireit/ poison fixtures, intentionally
  # ship outdated / vulnerable dependencies so MegaLinter's own security
  # scanners (grype, osv-scanner, syft, trivy...) have something to flag.
  # Dependabot SECURITY updates do not honour this `ignore` (nor
  # `exclude-paths`, see dependabot/dependabot-core#14408): the
  # close-frozen-fixture-prs.yml workflow closes the ones touching only frozen
  # fixtures, and flags the ones mixing them with other updates.
  - package-ecosystem: "npm"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"

  # Same for the other ecosystems that have fixtures under .automation/test
  # (the .wireit/ poison fixtures, e.g. requirements.txt with django==1.2, guard
  # the excluded directories forwarding).
  - package-ecosystem: "pip"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "uv"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "bundler"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "gomod"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "cargo"
    directories:
      - "/.automation/test/**"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"

  # Maintain dependencies for ruby with bundler
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Maintain dependencies for docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/flavors"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/linters"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Maintain dependencies for python with pip
  - package-ecosystem: "pip"
    directory: "/.config/python/dev/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/megalinter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
