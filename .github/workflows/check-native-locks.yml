---
# Checks that the native install locks (megalinter/descriptors/native-locks) match the descriptors.
#
# Called by the alpha, beta and release deploy workflows: their publish jobs need it, so nothing
# is published while a lock is missing or stale. Pull requests only get a warning (test-native.yml):
# the "Native locks" workflow refreshes the locks on the branch, and "Auto-Update Linters" on main
# (after a Renovate merge).
name: "Check native locks"
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Native locks are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema
      - name: Check locks are up to date
        run: |
          if ! python .automation/native_lock.py --check; then
            echo "::error title=Native locks are stale::Merge the \"[automation] Auto-update linters version, help, documentation and native locks\" pull request (or run the \"Native locks\" workflow manually), then deploy again"
            exit 1
          fi
