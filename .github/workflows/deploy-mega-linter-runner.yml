---
name: "Deploy mega-linter-runner"

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag to publish under (example: latest, beta)"
        required: false
        default: latest
        type: string
      prerelease:
        description: Bump a prerelease version before publishing
        required: false
        default: false
        type: boolean
      preid:
        description: Prefix used for the prerelease identifier when enabled
        required: false
        default: beta
        type: string
  workflow_call:
    inputs:
      dist-tag:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
      preid:
        required: false
        type: string

permissions: {}
jobs:
  publish:
    name: Publish mega-linter-runner to npm
    runs-on: ubuntu-latest
    environment:
      name: release-runner
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_DIR: mega-linter-runner
      DIST_TAG: ${{ inputs['dist-tag'] && inputs['dist-tag'] || 'latest' }}
      PREID: ${{ inputs.preid && inputs.preid || 'beta' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NODE_AUTH_TOKEN: ""
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: yarn
          cache-dependency-path: mega-linter-runner/yarn.lock
          scope: nvuillam

      - name: Install dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: yarn install --frozen-lockfile

      - name: Prepare prerelease version
        if: inputs.prerelease == true
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          TIMESTAMP=$(date '+%Y%m%d%H%M')
          npm version prerelease --preid="${PREID}${TIMESTAMP}"

      - name: Publish to npm
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --provenance --tag "${DIST_TAG}"

      # npm accepts the upload, then processes it for a few minutes: the job only ends once the
      # version can be installed, with its dist-tag and its provenance attestation
      - name: Wait until the version is available on npm
        working-directory: ${{ env.PACKAGE_DIR }}
        timeout-minutes: 35
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          REGISTRY=https://registry.npmjs.org
          for attempt in $(seq 1 60); do
            METADATA=$(curl -sf -H "Cache-Control: no-cache" "${REGISTRY}/${NAME}/${VERSION}?nocache=${attempt}" || true)
            TAGGED=$(curl -sf -H "Cache-Control: no-cache" "${REGISTRY}/-/package/${NAME}/dist-tags?nocache=${attempt}" | jq -r --arg tag "${DIST_TAG}" '.[$tag] // empty' || true)
            TARBALL=$(echo "${METADATA}" | jq -r '.dist.tarball // empty' 2>/dev/null || true)
            ATTESTATIONS=$(echo "${METADATA}" | jq -r '.dist.attestations.url // empty' 2>/dev/null || true)
            if [ -n "${TARBALL}" ] && [ "${TAGGED}" = "${VERSION}" ] && [ -n "${ATTESTATIONS}" ] \
              && curl -sfIL "${TARBALL}" > /dev/null && curl -sf "${ATTESTATIONS}" > /dev/null; then
              echo "${NAME}@${VERSION} is available on npm with dist-tag ${DIST_TAG} and its provenance attestation"
              exit 0
            fi
            echo "Attempt ${attempt}/60: ${NAME}@${VERSION} not available yet (dist-tag ${DIST_TAG}: ${TAGGED:-none})"
            sleep 30
          done
          echo "::error::${NAME}@${VERSION} was published but is still not available on npm after 30 minutes"
          exit 1
