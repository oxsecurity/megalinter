---
#########################
#########################
## Deploy Docker Image Flavors ##
#########################
#########################
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#######################################
# Start the job on all push to main #
#######################################
name: "Build & Deploy - Release linters"
on:
  release:
    # Want to run the automation when a release is created
    types: ["created"]

###############
# Set the Job #
###############
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  get-linters-matrix:
    name: Get Linters Matrix
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.set-matrix.outputs.jobs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read linters_matrix.json
        id: set-matrix
        run: |
          # One job per linter, carrying the platforms its :beta manifest
          # actually provides: asking buildx for linux/arm64 on a linter that
          # has no arm64 beta image would fail to resolve the base image.
          jobs=$(jq -c '
            [.["linux/amd64"][]] as $amd
            | [.["linux/arm64"][]] as $arm
            | ($amd + $arm | unique)
            | map(. as $linter | {
                linter: $linter,
                platforms: ([
                  (if ($amd | index($linter)) then "linux/amd64" else empty end),
                  (if ($arm | index($linter)) then "linux/arm64" else empty end)
                ] | join(","))
              })
          ' .automation/generated/linters_matrix.json)
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"

  build:
    name: Deploy Docker Image - Release - Linters
    runs-on: ubuntu-latest
    needs: get-linters-matrix
    permissions:
      packages: write
      # Require writing security events to upload SARIF file to security tab
      security-events: write
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-linters-matrix.outputs.jobs) }}
    # Only run this on the main repo
    if: github.repository == 'oxsecurity/megalinter' && !contains(github.event.head_commit.message, 'skip deploy')
    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required to build more than one platform in a single invocation:
      # the default docker driver only handles the runner's own platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get current date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      # Dockerfile-release only stamps version metadata on top of the :beta
      # image, which BETA-linters already published as a multi-arch manifest
      # and already tested on every platform it supports. Building every
      # platform in one invocation lets buildx resolve the matching base for
      # each of them and push a manifest list directly, so no per-platform
      # matrix, digest artifact or merge job is needed. It contains no RUN
      # instruction, so no emulation is involved either.
      - name: Build Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile-release
          platforms: ${{ matrix.platforms }}
          build-args: |
            MEGALINTER_BASE_IMAGE=ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:beta
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ github.event.release.tag_name }}
          load: false
          push: true
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # MAJOR-RELEASE-IMPACTED
          tags: |
            ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:v10
            ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:${{ github.event.release.tag_name }}
            ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:latest

      - name: Inspect image
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          MATRIX_LINTER: ${{ matrix.linter }}
        run: |
          docker buildx imagetools inspect ghcr.io/oxsecurity/megalinter-only-"${MATRIX_LINTER}":"${GITHUB_EVENT_RELEASE_TAG_NAME}"

      # Docker Hub mirroring is disabled — MegaLinter is published to ghcr.io only.
      # - name: Invoke Mirror docker image workflow (Standalone image)
      #   uses: benc-uk/workflow-dispatch@7a027648b88c2413826b6ddd6c76114894dc5ec4 # v1
      #   with:
      #     workflow: mirror-docker-image.yml
      #     # MAJOR-RELEASE-IMPACTED
      #     inputs: '{ "source-image": "ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:v10", "target-image": "docker.io/oxsecurity/megalinter-only-${{ matrix.linter }}:v10", "free-space-before": "false" }'
      #     ref: main

      ##############################################
      # Check Docker image security with Trivy #
      ##############################################
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: "v0.73.0"
          image-ref: ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:${{ github.event.release.tag_name }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: 10m0s
        env:
            ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Run OSV-Scanner vulnerability scanner
      #   uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
      #   with:
      #     scan-args: |-
      #       --docker ghcr.io/oxsecurity/megalinter-only-${{ matrix.linter }}:${{ github.event.release.tag_name }}
