---
# Publishes the megalinter Python package (native mode: `megalinter` command) to PyPI
#
# - beta: pre-release `<last release>.post0.dev<timestamp>`, at most one per day. pip and uv ignore
#   it unless asked (`--pre`), and `mega-linter-runner --native --release beta` installs it
# - stable: the version of megalinter/__about__.py, published only when the repository variable
#   PUBLISH_PYPI_STABLE is "true" (switched on when native mode leaves beta)
#
# PyPI Trusted Publishing (OIDC, no token stored) with attestations: the runner verifies that the wheel
# was published by this workflow of oxsecurity/megalinter before installing it.
name: "Deploy MegaLinter to PyPI"
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "beta or stable"
        type: choice
        options:
          - beta
          - stable
        default: beta

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the wheel (${{ inputs.channel }})
    if: github.repository == 'oxsecurity/megalinter' && (inputs.channel == 'beta' || vars.PUBLISH_PYPI_STABLE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Beta: skip when the last beta is less than 24 hours old
      - name: Compute the version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'EOF'
          import datetime, json, os, re, urllib.request

          about = open("megalinter/__about__.py", encoding="utf-8").read()
          release = re.search(r'__version__ = "([^"]+)"', about).group(1)
          now = datetime.datetime.now(datetime.timezone.utc)
          skip = False
          version = release
          if os.environ["CHANNEL"] == "beta":
              version = f"{release}.post0.dev{now:%Y%m%d%H%M%S}"
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/megalinter/json", timeout=60) as response:
                      published = json.load(response)["releases"]
              except urllib.error.HTTPError:
                  published = {}
              for existing, files in published.items():
                  if ".dev" not in existing or not files:
                      continue
                  uploaded = datetime.datetime.fromisoformat(files[0]["upload_time_iso_8601"].replace("Z", "+00:00"))
                  if now - uploaded < datetime.timedelta(hours=24):
                      skip = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\nversion={version}\n")
          with open("megalinter/__about__.py", "w", encoding="utf-8") as f:
              f.write(f'__version__ = "{version}"\n')
          EOF

      # The wheel carries every Python dependency of the core, pinned with hashes (from uv.lock)
      - name: Export the hashed core requirements
        if: steps.version.outputs.skip != 'true'
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file megalinter/_core-requirements.lock

      - name: Build the wheel
        if: steps.version.outputs.skip != 'true'
        run: uv build --wheel --out-dir dist

      - name: Check the wheel content
        if: steps.version.outputs.skip != 'true'
        run: |
          python - <<'EOF'
          import glob, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in (
              "megalinter/cli.py",
              "megalinter/_core-requirements.lock",
              "megalinter/_templates/mega-linter.yml",
              "megalinter/descriptors/native-runtimes.yml",
          ):
              assert required in names, f"{required} missing from {wheel}"
          assert any(n.startswith("megalinter/descriptors/native-locks/") for n in names), "native locks missing"
          assert not any(n.startswith("megalinter/tests/") for n in names), "tests must not be packaged"
          print(f"{wheel}: {len(names)} files")
          EOF

      - name: Upload the wheel
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: megalinter-wheel
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (${{ inputs.channel }})
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/megalinter/
    permissions:
      # Trusted Publishing (OIDC): no PyPI token is stored anywhere
      id-token: write
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: megalinter-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
