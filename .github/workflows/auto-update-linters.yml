---
name: "Auto-Update Linters"
on:
  # Run when there is an update in main
  push:
    branches:
      - main
      - auto-update
      - fixes/docgen
  # Automatically run every day at 21:49 UTC, before a start of hour peak
  schedule:
    - cron: "49 21 * * *"
  # Allow to manually trigger a run of the workflow
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

###############
# Set the Job #
###############
jobs:

  # Audits the community plugins of .automation/plugins.yml: build_help_versions generates their
  # documentation pages from the results. Read-only and without secrets: it only downloads the
  # public plugin descriptors. When it fails, the committed results are used
  plugins_audit:
    name: Audit community plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && github.repository == 'oxsecurity/megalinter'
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema
      - name: Audit plugins
        run: python .automation/plugins_audit.py
      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugins-audit
          path: .automation/generated/plugins-audit.json
          if-no-files-found: error

  build_help_versions:
    # Name the Job
    name: Auto-Update Linters
    needs: [plugins_audit]
    # Set the agent to run on
    runs-on: ubuntu-latest
    # Read-only: the token goes into the container that runs every linter. The pull_request job
    # writes the changes
    permissions:
      contents: read
    environment:
      name: auto-update
    # Prevent duplicate run from happening when a forked push is committed. Runs even when the
    # plugins audit failed
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && github.repository == 'oxsecurity/megalinter' }}
    # Set max build time for the job
    timeout-minutes: 60
    outputs:
      has_updated_versions: ${{ steps.compute_versions.outputs.has_updated_versions }}
      plugins_changed: ${{ steps.plugins_changes.outputs.changed }}
    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Results of the plugins audit, read by build.py to generate the plugin pages
      - name: Download plugins audit
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins-audit
          path: .automation/generated

      # Free disk space
      - name: Free Disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android  # will release about 10 GB if you don't need Android
          sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache/CodeQL # large cache
          sudo rm -rf /opt/hostedtoolcache/go # Go toolcache

      #######################
      # Docker Buildx setup #
      #######################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      ########################
      # Get the current date #
      ########################
      - name: Get current date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      ###################################
      # Build image locally for testing #
      ###################################
      - name: Build MegaLinter Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_REVISION=auto_update_${{ github.sha }}
            BUILD_VERSION=auto_update_${{ github.sha }}
          load: true
          push: false
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            oxsecurity/megalinter:auto_update_${{ github.sha }}
        timeout-minutes: 60

      #####################################
      # Collect linters versions & help    #
      #####################################
      - name: Collect latest versions and help
        id: compute_versions
        shell: bash
        run: docker run -e UPGRADE_LINTERS_VERSION=true -e GITHUB_SHA=${{ github.sha }} -e GITHUB_TOKEN="${GITHUB_TOKEN}" -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -e GITHUB_OUTPUT="${GITHUB_OUTPUT}" -e MEGALINTER_VOLUME_ROOT="${GITHUB_WORKSPACE}" -v "/var/run/docker.sock:/var/run/docker.sock:rw" -v "/home/runner/work/_temp/_runner_file_commands":"/github/file_commands" -v "${GITHUB_WORKSPACE}:/tmp/lint" oxsecurity/megalinter:auto_update_${{ github.sha }}
        timeout-minutes: 60

      # The plugins audit keeps the date of unchanged results: its file changes only when the
      # results of a plugin do, and the plugin pages are then exported even without a new
      # linter version
      - name: Detect plugins audit changes
        id: plugins_changes
        run: |
          if [ -n "$(git status --porcelain -- .automation/generated/plugins-audit.json)" ]; then
            echo "changed=1" >> "${GITHUB_OUTPUT}"
          fi

      # Format markdown tables
      - name: Format Markdown tables
        id: format-md-tables
        run: npx --yes markdown-table-formatter@latest --verbose "./**/*.md" || true

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            docs
            megalinter-reports

      # The agent plugin follows its own release train: the skills it ships are
      # regenerated by this workflow, much more often than MegaLinter is released
      - name: Bump agent plugin version
        if: (github.event_name == 'workflow_dispatch' || steps.compute_versions.outputs.has_updated_versions == 1)
        shell: bash
        run: python3 .automation/agent_plugin_manifests.py --bump

      # The pull_request job applies these changes together with the native locks. Without a new
      # linter version they are dropped, as the agent plugin version is not bumped
      - name: Export generated changes
        if: (github.event_name == 'workflow_dispatch' || steps.compute_versions.outputs.has_updated_versions == 1)
        run: |
          git add -A
          git status --short
          git diff --cached --binary > "${RUNNER_TEMP}/auto-update.patch"
      # Only the plugins documentation when no linter version changed (the agent plugin version is
      # not bumped, so the other generated changes are dropped as above)
      - name: Export plugins documentation changes
        if: (github.event_name != 'workflow_dispatch' && steps.compute_versions.outputs.has_updated_versions != 1 && steps.plugins_changes.outputs.changed == '1')
        run: |
          git add -- .automation/generated/plugins-audit.json docs/plugins docs/plugins.md README.md docs/index.md mkdocs.yml
          git status --short
          git diff --cached --binary > "${RUNNER_TEMP}/auto-update.patch"
      - name: Upload generated changes
        if: (github.event_name == 'workflow_dispatch' || steps.compute_versions.outputs.has_updated_versions == 1 || steps.plugins_changes.outputs.changed == '1')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auto-update-patch
          path: ${{ runner.temp }}/auto-update.patch
          if-no-files-found: error

  # Runs in parallel with build_help_versions: the locks only depend on the descriptors, which the
  # auto-update run does not change. Renovate branches skip the "Native locks" workflow, so this job
  # refreshes their locks after the merge, in the same pull request as the versions and docs
  native_locks:
    name: Generate native locks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && github.repository == 'oxsecurity/megalinter'
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same toolchain as native-lock.yml (feature branches and manual runs)
      - name: Setup the native lock toolchain
        uses: ./.github/actions/native-lock-setup
      # Every download is verified (GitHub attestation, cosign, GPG or upstream checksums) before its
      # sha256 is pinned. A re-tagged release fails here: run the "Native locks" workflow manually
      # with accept_changes after reviewing it
      - name: Generate locks
        run: python .automation/native_lock.py --runtimes --verify-signatures
      # Locks generated successfully are kept even when some linters failed (the run stays red)
      - name: Upload locks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-locks
          path: megalinter/descriptors/native-locks/
          if-no-files-found: error

  pull_request:
    name: Create the auto-update pull request
    needs: [build_help_versions, native_locks]
    # One failing job must not hold back the other one's changes
    if: ${{ !cancelled() && (needs.build_help_versions.result == 'success' || needs.native_locks.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: auto-update
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download generated changes
        id: download_patch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auto-update-patch
          path: ${{ runner.temp }}/auto-update
      - name: Download native locks
        id: download_locks
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-locks
          path: ${{ runner.temp }}/native-locks
      # Track generated files so branch switches in create-pull-request do not fail on untracked outputs
      - name: Stage generated changes
        id: stage
        env:
          PATCH_DOWNLOADED: ${{ steps.download_patch.outcome == 'success' }}
          LOCKS_DOWNLOADED: ${{ steps.download_locks.outcome == 'success' }}
        run: |
          if [ "${PATCH_DOWNLOADED}" = "true" ] && [ -s "${RUNNER_TEMP}/auto-update/auto-update.patch" ]; then
            git apply --index --binary "${RUNNER_TEMP}/auto-update/auto-update.patch"
          fi
          if [ "${LOCKS_DOWNLOADED}" = "true" ]; then
            rsync -a --delete "${RUNNER_TEMP}/native-locks/" megalinter/descriptors/native-locks/
            git add -A megalinter/descriptors/native-locks
            if ! git diff --cached --quiet -- megalinter/descriptors/native-locks; then
              echo "locks_changed=1" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "::warning::No native locks generated, the pull request does not refresh them"
          fi
          git status --short

      # Create pull request if there are updates or if the workflow has been launched manually
      - name: Create Pull Request
        id: cpr
        if: (github.event_name == 'workflow_dispatch' || needs.build_help_versions.outputs.has_updated_versions == '1' || needs.build_help_versions.outputs.plugins_changed == '1' || steps.stage.outputs.locks_changed == '1')
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          # SECURITY NOTE: A Personal Access Token (PAT) is used here so the
          # auto-update PR can trigger downstream CI workflows. End-users
          # should NOT copy this pattern — using a PAT is NOT recommended
          # because open-source projects have been heavily targeted by
          # supply-chain attacks recently, and a leaked PAT can give
          # attackers broad write access to your repository.
          # If you only need workflows to re-trigger after MegaLinter pushes
          # a fix, manually re-run the workflow or push another commit on
          # the branch instead of configuring a PAT.
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN  }}
          author: "Nicolas Vuillamy <nicolas.vuillamy@gmail.com>"
          commit-message: "[automation] Auto-update linters version, help, documentation and native locks"
          delete-branch: true
          title: "[automation] Auto-update linters version, help, documentation and native locks"
          body: |
            [automation] Auto-update linters version, help, documentation and native locks
            ${{ steps.stage.outputs.locks_changed == '1' && '
            Native install locks changed: review the diff of `megalinter/descriptors/native-locks/` before merging (no automerge). Every artifact was verified with its declared provenance before being pinned, except the `unverified` ones, pinned on first download.' || '' }}
          # Pinned hashes are reviewed by a maintainer: no automerge when the locks changed
          labels: ${{ steps.stage.outputs.locks_changed == '1' && 'dependencies' || 'dependencies,automerge' }}
      - name: Display Pull Request Info
        if: steps.cpr.outcome == 'success'
        run: |
          echo "Pull Request Number - ${STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER}"
          echo "Pull Request URL - ${STEPS_CPR_OUTPUTS_PULL_REQUEST_URL}"
        env:
          STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          STEPS_CPR_OUTPUTS_PULL_REQUEST_URL: ${{ steps.cpr.outputs.pull-request-url }}
