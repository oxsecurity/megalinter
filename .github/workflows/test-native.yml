---
name: "Test native mode"
# Installs EVERY linter natively (no Docker) on the 5 supported platforms, then runs the usual
# linter test classes against the native installs. Nothing is installed on a developer machine:
# this workflow is where the native installs are exercised.
on:
  push:
    branches:
      - main
    paths:
      - "megalinter/**"
      - ".automation/native*"
      - ".automation/test/**"
      - ".github/workflows/test-native.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "megalinter/**"
      - ".automation/native*"
      - ".automation/test/**"
      - ".github/workflows/test-native.yml"
      - "pyproject.toml"
  # Upstream artifacts and registries can change: check regularly that every install still works
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      shard_size:
        description: "Number of linters installed and tested per job"
        default: "10"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  descriptors:
    name: Native descriptors and locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema
      # Every linter declares its native install on the 5 platforms
      - name: Check native_install declarations
        run: python -m megalinter.native.spec
      # Locks are generated by the "Native locks" workflow: none may be missing or stale
      - name: Check locks are up to date
        if: ${{ !startsWith(github.head_ref, 'renovate/') }}
        run: python .automation/native_lock.py --check

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema pytest pytest-timeout
      - name: Run native unit tests
        run: python -m pytest megalinter/tests/test_megalinter/native -v --timeout=300

  matrix:
    name: Compute the install matrix
    # Renovate bumps descriptor versions, which makes their locks stale until the "Native locks" workflow refreshes them after merge
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install MegaLinter
        run: python -m pip install -e .
      - name: Compute matrix
        id: matrix
        env:
          SHARD_SIZE: ${{ inputs.shard_size || '10' }}
        run: echo "matrix=$(python .automation/native_ci.py matrix --shard-size "$SHARD_SIZE")" >> "$GITHUB_OUTPUT"

  linters:
    name: ${{ matrix.name }} (${{ matrix.os }})
    needs: [matrix, descriptors]
    # Renovate bumps descriptor versions, which makes their locks stale until the "Native locks" workflow refreshes them after merge
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      MEGALINTER_NATIVE: "true"
      NATIVE_INSTALL_RUNTIMES: auto
      VERSION_GET_AT_RUNTIME: "true"
      PYTHONUTF8: "1"
      LINTERS: ${{ matrix.linters }}
      HOST_LINTERS: ${{ matrix.host_linters }}
      TESTS: ${{ matrix.tests }}
      HOST_TESTS: ${{ matrix.host_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set the native install folder
        run: echo "MEGALINTER_HOME=${RUNNER_TEMP}/megalinter-home" >> "${GITHUB_ENV}"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema pytest pytest-timeout pytest-rerunfailures

      # Runtimes that have no verifiable portable download are provided by the runner
      - name: Setup Ruby
        if: contains(matrix.host_runtimes, 'ruby')
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: Setup R
        if: contains(matrix.host_runtimes, 'r')
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Setup PHP
        if: contains(matrix.host_runtimes, 'php')
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
      - name: Add the Rust clippy component
        if: contains(matrix.host_runtimes, 'rust')
        run: rustup component add clippy
      # Tools that MegaLinter does not download itself (declared with `suggest`)
      - name: Install host-provided tools
        run: python .automation/native_ci.py prepare --linters "$LINTERS,$HOST_LINTERS"

      # The install test: every linter of the shard downloaded by MegaLinter is installed from its lock
      - name: Install linters
        if: env.LINTERS != ''
        run: megalinter install-linters ${LINTERS//,/ } --runtimes auto
      # Linters provided by the host can only be tested where the runner provides them:
      # their tests are skipped when the tool is missing
      - name: Register host-provided linters
        if: env.HOST_LINTERS != ''
        run: megalinter install-linters ${HOST_LINTERS//,/ } --runtimes auto || echo "::warning::Some host-provided tools are not available on this runner, their tests are skipped"
      - name: Show native status
        run: megalinter list-linters --json

      # The usual test classes, run against the native installs
      - name: Test linters
        if: env.TESTS != ''
        # GITHUB_WORKSPACE (the repository checkout) would make MegaLinter use the repository's own
        # .github/linters configurations instead of the default ones, unlike the Docker test runs
        run: env -u GITHUB_WORKSPACE python -m pytest megalinter/tests/test_megalinter/linters -k "$TESTS" -v --timeout=600 --reruns 2 --reruns-delay 5

      # Host-provided tools come in the version of the runner, which can differ from the Docker one:
      # their results are reported without failing the job
      - name: Test host-provided linters
        if: env.HOST_TESTS != ''
        continue-on-error: true
        run: env -u GITHUB_WORKSPACE python -m pytest megalinter/tests/test_megalinter/linters -k "$HOST_TESTS" -v --timeout=600 --reruns 1 --reruns-delay 5

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            megalinter-reports
            ${{ runner.temp }}/megalinter-home/state.json
          if-no-files-found: ignore

  # MegaLinter downloads and verifies the language runtimes itself when the host has none
  provisioning:
    name: Runtime provisioning (${{ matrix.os }})
    needs: [descriptors]
    # Renovate bumps descriptor versions, which makes their locks stale until the "Native locks" workflow refreshes them after merge
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            linters: PYTHON_BLACK,CSS_STYLELINT,JAVA_CHECKSTYLE,CSHARP_CSHARPIER,REPOSITORY_DUSTILOCK,POWERSHELL_POWERSHELL,DART_DARTANALYZER
            tests: python_black_test or css_stylelint_test or java_checkstyle_test or csharp_csharpier_test or repository_dustilock_test or powershell_powershell_test or dart_dartanalyzer_test
          - os: ubuntu-24.04-arm
            linters: PYTHON_BLACK,CSS_STYLELINT,JAVA_CHECKSTYLE,CSHARP_CSHARPIER,REPOSITORY_DUSTILOCK,POWERSHELL_POWERSHELL,DART_DARTANALYZER
            tests: python_black_test or css_stylelint_test or java_checkstyle_test or csharp_csharpier_test or repository_dustilock_test or powershell_powershell_test or dart_dartanalyzer_test
          - os: macos-latest
            linters: PYTHON_BLACK,CSS_STYLELINT,JAVA_CHECKSTYLE,CSHARP_CSHARPIER,REPOSITORY_DUSTILOCK,POWERSHELL_POWERSHELL,DART_DARTANALYZER
            tests: python_black_test or css_stylelint_test or java_checkstyle_test or csharp_csharpier_test or repository_dustilock_test or powershell_powershell_test or dart_dartanalyzer_test
          - os: windows-latest
            linters: PYTHON_BLACK,CSS_STYLELINT,JAVA_CHECKSTYLE,CSHARP_CSHARPIER,REPOSITORY_DUSTILOCK,POWERSHELL_POWERSHELL,DART_DARTANALYZER,PHP_PHPCS
            tests: python_black_test or css_stylelint_test or java_checkstyle_test or csharp_csharpier_test or repository_dustilock_test or powershell_powershell_test or dart_dartanalyzer_test or php_phpcs_test
    defaults:
      run:
        shell: bash
    env:
      MEGALINTER_NATIVE: "true"
      NATIVE_INSTALL_RUNTIMES: auto
      # The runner's own node, java, dotnet... are ignored: runtimes must be downloaded by MegaLinter
      NATIVE_IGNORE_HOST_RUNTIMES: "true"
      VERSION_GET_AT_RUNTIME: "true"
      PYTHONUTF8: "1"
      LINTERS: ${{ matrix.linters }}
      TESTS: ${{ matrix.tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set the native install folder
        run: echo "MEGALINTER_HOME=${RUNNER_TEMP}/megalinter-home" >> "${GITHUB_ENV}"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install MegaLinter
        run: python -m pip install -e . jsonschema pytest pytest-timeout pytest-rerunfailures
      - name: Install linters and their runtimes
        run: megalinter install-linters ${LINTERS//,/ } --runtimes auto
      - name: Test linter versions
        run: env -u GITHUB_WORKSPACE python -m pytest megalinter/tests/test_megalinter/linters -k "($TESTS) and test_get_linter_version" -v --timeout=600 --reruns 2 --reruns-delay 5
