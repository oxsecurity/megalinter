name: "Check documentation generation"
on:
  push:
    paths:
      - "**/mkdocs.yml"
      - "docs/**"
      - ".config/python/dev/requirements.txt"
      - ".github/workflows/test-docs.yml"
  pull_request:
    paths:
      - "**/mkdocs.yml"
      - "docs/**"
      - ".config/python/dev/requirements.txt"
      - ".github/workflows/test-docs.yml"

permissions: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:

  test-doc-gen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - run: pip install --upgrade -r .config/python/dev/requirements.txt
      - run: cd .automation && bash build_schemas_doc.sh && cd ..
      - run: zensical build
