---
name: "Native locks"
on:
  # Locks are regenerated when the descriptors change on main (linter or runtime version bump)
  push:
    branches:
      - main
    paths:
      - "megalinter/descriptors/**.megalinter-descriptor.yml"
      - "megalinter/descriptors/shared/**"
      - "megalinter/descriptors/native-runtimes.yml"
      - ".automation/native_lock.py"
      - ".automation/native-keys/**"
  # Manual run on any branch: opens a pull request against this branch with the refreshed locks
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every lock, even the ones whose descriptor did not change"
        type: boolean
        default: false
      accept_changes:
        description: "Accept artifacts that changed upstream for an already locked version (review the diff!)"
        type: boolean
        default: false

permissions: {}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  native_locks:
    name: Generate native locks
    runs-on: ubuntu-latest
    if: github.repository == 'oxsecurity/megalinter'
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: auto-update
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install MegaLinter
        run: python -m pip install -e .

      - name: Check native_install declarations
        run: python -m megalinter.native.spec

      # Every download is verified (GitHub attestation, cosign, GPG or upstream checksums)
      # before its sha256 is pinned. A re-tagged release fails here unless a maintainer
      # accepts the change explicitly
      - name: Generate locks
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          ACCEPT_CHANGES: ${{ inputs.accept_changes && '--accept-changes' || '' }}
        run: python .automation/native_lock.py --runtimes --verify-signatures $FORCE $ACCEPT_CHANGES

      - name: Stage generated changes
        run: |
          git add -A megalinter/descriptors/native-locks
          git status --short

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # SECURITY NOTE: see auto-update-linters.yml (PAT only used so that the pull request triggers the CI)
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          author: "Nicolas Vuillamy <nicolas.vuillamy@gmail.com>"
          commit-message: "[automation] Refresh native install locks"
          base: ${{ github.ref_name }}
          branch: automation/native-locks-${{ github.ref_name }}
          delete-branch: true
          title: "[automation] Refresh native install locks (${{ github.ref_name }})"
          body: |
            [automation] Native install locks regenerated by `.automation/native_lock.py`.

            Review the diff of `megalinter/descriptors/native-locks/`: every artifact was verified
            with its declared provenance before being pinned, and any upstream change of an already
            locked version is refused unless `accept_changes` was set.
